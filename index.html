<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESN Labs｜開發者網站</title>
  <meta name="description" content="ESN Labs 開發者網站，提供各 App 的產品資訊、隱私權政策與支援連結。">
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; color: #24211f; background: #fffaf4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 860px; margin: 0 auto; padding: 72px 24px 96px; }
    h1 { margin: 0; font-size: clamp(42px, 8vw, 72px); letter-spacing: -0.04em; }
    .lead { max-width: 680px; margin: 18px 0 48px; color: #5e5751; font-size: 18px; line-height: 1.8; }
    .apps { display: grid; gap: 20px; }
    .card { padding: 28px; border-radius: 20px; background: #fff; box-shadow: 0 10px 28px #2c1b1214; }
    .card h2 { margin: 0 0 10px; font-size: 28px; }
    .card p { margin: 8px 0 20px; line-height: 1.7; }
    .links { display: flex; flex-wrap: wrap; gap: 12px 20px; }
    a { color: #d94b35; font-weight: 600; }
    footer { margin-top: 52px; color: #8a8179; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>ESN Labs</h1>
    <p class="lead">打造簡單、實用、讓日常更順手的 App。這裡可以找到各個產品的介紹、隱私權政策與支援連結。</p>
    <section class="apps" aria-label="App 列表">
      <article class="card">
        <h2>吃啥</h2>
        <p>不要想，滑就對了。用滑卡方式幫你決定今天吃什麼，再交給 Google Maps 帶你找到附近餐點。</p>
        <div class="links">
          <a href="./chisha/">查看吃啥 App</a>
          <a href="./chisha/privacy/">隱私權政策</a>
        </div>
      </article>
    </section>
    <footer>© 2026 ESN Labs</footer>
  </main>
</body>
</html>
